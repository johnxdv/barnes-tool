<!--
  Écusson Barnes International — actif de marque officiel, non modifiable.

  Ce fichier est le logo tel qu'il est servi par barnes-provence-littoral.com
  (`assets/barnes-international-logo-*.svg`), repris sans retouche : mêmes
  tracés, même gris #3C3C3C, fond transparent. Il remplace la recréation
  vectorielle qui tenait cette place et qui, si fidèle fût-elle, s'écartait de
  l'original — les lettres y étaient composées en Georgia sur un arc plutôt que
  vectorisées, et l'écusson y était rouge.

  ► C'est LE point de remplacement. Tout l'outil — écran d'adresse, formulaire
    de caractéristiques, chaque page du rapport imprimé — affiche ce fichier et
    lui seul, via `src/components/ui/LogoBarnes.jsx`. Déposer ici une autre
    version officielle (même nom, SVG ou PNG transparent) la propage partout
    d'un coup, sans toucher à une ligne de JSX.
-->
